# Hydra target class
_target_: uaug.episodes.pipeline.EpisodePipeline

# Synthesis results directory holding instances.<split>.jsonl (set per run)
instances_dir: null
# Which split to run on
split: val
# One episode per (instance, seed)
seeds: [0]
# Override the per-instance question budget (null = use instance.budget)
budget_override: null

# Agent policy (selected via the agent config group)
agent: ${agent}
# User simulator (selected via the user config group)
user: ${user}
# Rubric judge (selected via the judge config group)
judge: ${judge}
