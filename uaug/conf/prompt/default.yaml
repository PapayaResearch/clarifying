##############################
# Synthesis prompts
##############################

decompose_prompt: |
  Given a complete, detailed description of an image, decompose it into a list of atomic details.

  Rules:
  - Each detail states exactly ONE checkable fact about the image (one entity, one attribute value, one relation, one style/count/layout fact). Split compound sentences into separate details.
  - Each detail must be objectively verifiable from the description alone. Skip subjective filler ("inviting aesthetic", "sense of elegance") unless it names a concrete visual style.
  - Each detail must be self-contained: name the entities it refers to explicitly (write "the cake stand is white", never "it is white").
  - The category must be one of the allowed categories below. Prefer the most precise label that applies.
  - importance is how much the image would change if this detail were different, from 0 (barely noticeable) to 1 (defining feature of the image). Central subjects and their defining attributes score high; incidental background facts score low.
  - check is a self-contained yes/no question a judge can ask about ANY text describing this image to verify the detail is stated, e.g. "Does the text specify that the cake stand is white?". It must not depend on seeing other details.
  - Cover the entire description: every concrete visual fact should appear in exactly one detail. Do not invent facts that are not stated.

  Allowed categories:
  - entity: an object or subject is present in the scene.
  - attribute: a visual property (color, material, texture, size, shape, text content) of a named entity.
  - relation: a spatial or interactional relation between two named entities.
  - style: a global rendering or photographic property (medium, lighting, palette, mood-as-style, camera angle).
  - count: an explicit quantity of some entity.
  - layout: global composition or positioning within the frame.

erode_prompt: |
  You are given a list of image details. Write the request that a user who wants this image would plausibly type into an image-generation tool.

  Rules:
  - Include ONLY the facts in the given details. Do not add, embellish, or infer any other visual fact. Do not compensate for missing information: if the details say nothing about color, lighting, style, or background, your request says nothing about them either.
  - Write it as a natural, flowing request of 1-3 sentences, the way a real user writes ("A white cake with berries on a cake stand, next to a vase"), not as a list or a caption.
  - Keep the user's register casual and compact. Drop trivially inferable connective facts rather than enumerating every detail mechanically, but never drop a whole given detail.
  - Output only the request text.

filter_prompt: |
  You are given a user's image-generation request and a hidden detail about the image the user actually wants. Judge whether the hidden detail can be confidently inferred from the request alone.

  Rules:
  - "Inferable" means: an image model given only this request would very likely satisfy the hidden detail anyway - because the request implies it, common sense dictates it, or it is the overwhelming default for such a scene (e.g. "grass is green", "a wedding cake has tiers").
  - Merely plausible is NOT inferable. If several alternatives are about equally likely (a cake stand could be white, silver, glass, or wood), the detail is not inferable.
  - best_guess is the single most likely value/answer for the hidden detail given only the request.
  - confidence is your probability (0 to 1) that an image generated from the request alone would satisfy the hidden detail.

##############################
# Episode prompts
##############################

user_prompt: |
  You are role-playing a user who asked an assistant to generate an image. You know exactly what image you want: the complete ground-truth description is given as INTENT. The assistant may ask you clarification questions.

  Rules:
  - Answer only what was asked, truthfully, based on the INTENT. Keep it to 1-2 short, casual sentences.
  - Never volunteer details that were not asked about. If asked a broad question ("anything else I should know?"), mention only the single unstated detail you care most about.
  - If the question asks about something the INTENT does not specify, say you have no preference.
  - Never mention the INTENT, ground truth, specifications, or that you are role-playing. You are just a person who wants their image.

asker_prompt: |
  You are an assistant preparing to generate an image for a user. The user's request may be missing details that matter to them. You may ask clarification questions before committing to the image, but questions cost the user time - ask only when the expected value is high.

  Rules:
  - Reason about which aspects of the intended image are both unspecified and important: main subjects and their defining attributes, spatial arrangement, style/camera, counts.
  - Do NOT ask about anything that is already stated in the request, already answered in the conversation, or obvious from common sense.
  - Ask exactly ONE concise, easy-to-answer question at a time. Target the most important unresolved aspect first.
  - If the remaining uncertainty is low, or questions_left is 0, stop asking (set ask to false).

compose_prompt: |
  Write the complete, detailed description of the image implied by the user's request and the conversation.

  Rules:
  - Include EVERY detail the user stated in the request or answers - none may be dropped or altered.
  - Where something visually important is unspecified, fill in the single most likely choice so the description is complete and concrete (a real image has a definite answer for everything).
  - Write flowing descriptive prose, 100-180 words, in the style of a dense image caption. No meta-commentary, no lists.

##############################
# Training prompts
##############################

policy_prompt: |
  You are an assistant preparing to generate an image for a user. The user's request may be missing details that matter to them. You may ask clarification questions before committing to the image, but questions cost the user time - ask only when the expected value is high.

  On each turn, reply with exactly ONE of:
  - "QUESTION: <question>" - ask the single most valuable clarification question: one concise, easy-to-answer question about the most important unresolved aspect (main subjects and their defining attributes, spatial arrangement, style/camera, counts). Never ask about anything already stated in the request, already answered in the conversation, or obvious from common sense.
  - "FINAL: <description>" - commit to the image. The description must include EVERY detail from the request and the answers, fill in the single most likely choice for anything visually important that is still unspecified, and read as flowing descriptive prose of 100-180 words.

  If questions_left is 0, you must reply with FINAL.

judge_prompt: |
  You verify whether a piece of text satisfies a specific yes/no check about an image description.

  Rules:
  - Answer true only if the text explicitly states the fact or clearly entails it. Paraphrases and synonyms count.
  - If the text is silent about the fact, contradicts it, or is only vaguely compatible with it, answer false.
  - Judge only against the given text. Do not use outside knowledge about what is likely.
