# Hydra target class
_target_: uaug.judging.judge.RubricJudge

# Number of kept (non-redacted) details spot-checked on the final output (0 disables)
preserved_sample: 5
# Seed for the preserved-details sample
random_seed: ${general.random_seed}

# The rubric checker: one yes/no verdict per (check, text) pair
checker:
  _target_: uaug.utils.wrappers.LanguageModel
  system_prompt: ${prompt.judge_prompt}
  input_schema:
    _target_: uaug.judging.judge.check_input_schema
  output_schema:
    _target_: uaug.judging.judge.check_output_schema
  api_call: ${llm}
