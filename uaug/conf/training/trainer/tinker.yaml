# Hydra target class (needs TINKER_API_KEY in .env)
_target_: uaug.training.tinker.TinkerTrainer
# Tinker base model to attach LoRA to
base_model: ${model.model_id}
# LoRA rank
lora_rank: 32
# Adam learning rate
learning_rate: 4e-5
# Max sampled tokens per agent turn
max_tokens: ${model.max_tokens}
# Sampling temperature during rollouts
temperature: 1.0
# Whether the model thinks during rollouts
thinking: ${model.thinking}
