# Hydra target class
_target_: uaug.synthesis.pipeline.SynthesisPipeline

# Normalized sources file ({source_id, full_spec} per line)
sources_path: ${dataset.sources_path}
# Number of sources to process (null = all)
num_sources: 50
# Number of details to redact per instance
k: ${redaction.k}
# Restrict redaction to these categories (null = all)
categories: ${redaction.categories}
# Question budget stamped on each instance
budget: 5
# Drop sources whose decomposition yields fewer details than this
min_details: 8
# Example instances embedded in the run's HTML report
report_examples: 4
# Split fractions by source (assigned by seeded hash of source_id)
split_fractions:
  train: 0.6
  val: 0.2
  test: 0.2
# Random seed for reproducibility
random_seed: ${general.random_seed}
# Resume a previous synthesis run from an existing results directory
resume: false
# Existing results directory to resume from when resume=true
resume_path: null

# Decomposer: full description -> atomic details with category/importance/check
decomposer:
  _target_: uaug.utils.wrappers.LanguageModel
  system_prompt: ${prompt.decompose_prompt}
  input_schema:
    _target_: uaug.synthesis.schemas.decompose_input_schema
  output_schema:
    _target_: uaug.synthesis.schemas.decompose_output_schema
  api_call: ${llm}

# Eroder: kept details -> natural underspecified user request
eroder:
  _target_: uaug.utils.wrappers.LanguageModel
  system_prompt: ${prompt.erode_prompt}
  input_schema:
    _target_: uaug.synthesis.schemas.erode_input_schema
  output_schema:
    _target_: uaug.synthesis.schemas.erode_output_schema
  api_call: ${llm}
