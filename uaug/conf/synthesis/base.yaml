# Shared by every redaction scheme

# Normalized sources file ({source_id, full_spec} per line)
sources_path: ${dataset.sources_path}
# Number of sources to process (null = all)
num_sources: null
# Task name recorded in instances
task: ${task.name}
# Split fractions by source
split_fractions:
  train: 0.6
  val: 0.2
  test: 0.2
# Random seed for reproducibility
random_seed: ${general.random_seed}
# Resume a previous synthesis run from an existing results directory
resume: false
# Existing results directory to resume from when resume=true
resume_path: null

# Decomposer: full specification -> atomic details with category/importance/check
decomposer:
  _target_: uaug.utils.wrappers.LanguageModel
  system_prompt: ${task.decompose_prompt}
  input_schema:
    _target_: uaug.synthesis.schemas.decompose_input_schema
    text_description: |
      The complete, fully-specified text to decompose.
  output_schema:
    _target_: uaug.synthesis.schemas.decompose_output_schema
    categories: ${task.categories}
    details_description: |
      Every concrete fact in the text, one atomic detail each.
    text_description: |
      The detail as one self-contained factual sentence naming its entities explicitly.
    category_description: |
      The detail's category, one of the allowed categories in the instructions.
    importance_description: |
      How much the intended output would change if this detail were different, 0 to 1.
    check_description: |
      Self-contained yes/no question verifying that a text states this detail.
  api_call: ${llm}

# Eroder: kept details -> natural underspecified user request
eroder:
  _target_: uaug.utils.wrappers.LanguageModel
  system_prompt: ${task.erode_prompt}
  input_schema:
    _target_: uaug.synthesis.schemas.erode_input_schema
    details_description: |
      The details the user's request should contain.
  output_schema:
    _target_: uaug.synthesis.schemas.erode_output_schema
    request_description: |
      Natural 1-3 sentence user request containing only the given details.
  api_call: ${llm}
