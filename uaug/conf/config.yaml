##############################
# Defaults
##############################

defaults:
  - _self_
  - judge: default
  - training: default
  - evaluation: default
  # Orchestration LLM (e.g., gemini-3.5-flash-lite, gemini-3.7-flash)
  - llm: gemini-3.5-flash-lite
  # Model under test (e.g., qwen3-8b, nemotron3.5l-30b, gptoss-20b)
  - model: qwen3-8b
  # Dataset used (e.g., docci)
  - dataset: docci
  # Task to test (e.g., image-gen)
  - task: image-gen
  # Redaction scheme (e.g., fixed-redactions, variable-redactions)
  - synthesis: variable-redactions
  # Evaluation agent (e.g., no-asking, constant-asking, fixed-asking, open-asking)
  - agent: fixed-asking
  # User simulator (e.g., patient, impatient)
  - user: patient

##############################
# General Settings
##############################

general:
  # Details redacted per instance
  k: 15
  # Maximum number of parallel workers
  max_workers: 256
  # Random seed for reproducibility
  random_seed: 42

##############################
# Logging Settings
##############################

logging:
  # Base directory for writing log files
  log_dir: ${hydra:runtime.cwd}/logs
  # Base directory for writing run results
  results_dir: ${hydra:runtime.cwd}/results
  # Also log to console
  console: false
