# The patient user's answering model plus a stopping rule
defaults:
  - patient
  - _self_
# User name recorded in results
name: impatient-power
# Questions answered before the user asks for the result: T over 1..cap with P(T <= t) = (t / cap)^shape
patience:
  _target_: uaug.utils.user.PowerPatience
  shape: 1.5
