# Hydra target factory
_target_: uaug.utils.api.create_api_call
# litellm model identifier (needs OPENAI_API_KEY in .env)
model: gpt-5-mini
# Seconds to sleep before each call (rate limiting)
delay: 0
# Extra litellm completion parameters
params: {}
# Disk cache for responses (null disables caching)
cache_dir: ${logging.cache_dir}
# Abort once total spend exceeds this (USD)
max_usd: ${general.max_usd}
