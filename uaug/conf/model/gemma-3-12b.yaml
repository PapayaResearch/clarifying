# Gemma-3-12B-it (Google): open-weights instruct model near the 8-9B class.
# Not on the Tinker roster (Gemma license), so it runs on the local HF backend -
# needs a GPU box and pip install -e .[train_local].

# Hydra target class
_target_: uaug.utils.models.ChatModel
# Display name (used in result/log paths)
name: gemma-3-12b
# Serving backend: tinker (managed sampling + LoRA RL) or local (HF transformers)
provider: local
# Model identifier (HF model id)
model_id: google/gemma-3-12b-it
# Fine-tuned checkpoint (local dir; null = base weights)
checkpoint: null
# tinker-cookbook chat renderer (unused by the local backend - HF chat template applies)
renderer_name: null
# Max sampled tokens per agent call
max_tokens: 512
# Sampling temperature for agent calls (0 = greedy; training rollouts use the trainer's)
temperature: 0.0
# Disk cache for chat calls (invalid structured outputs are never cached)
cache_dir: ${logging.cache_dir}
