# Hydra target class
_target_: uaug.utils.wrappers.ChatModel
# Display name (used in result/log paths)
name: nemotron3.5l-30b
# Model identifier (HF model id, sampled via Tinker)
model_id: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
# Fine-tuned checkpoint (Tinker sampler path; null = base weights)
checkpoint: null
# Max sampled tokens per agent call
max_tokens: 2048
# Sampling temperature for agent calls (0 = greedy; training rollouts use training.temperature)
temperature: 0.0
