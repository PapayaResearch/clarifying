# Hydra target class
_target_: clarify.utils.user.UserSimulator
# User name recorded in results
name: patient
# No stopping rule: the budget of an episode is the agent's cap itself
patience: null
# The answering model
model:
  _target_: clarify.utils.wrappers.LanguageModel
  system_prompt: ${task.user_prompt}
  input_schema:
    _target_: clarify.utils.user.user_answer_input_schema
    intent_description: |
      The complete ground-truth specification of what the user wants.
    conversation_description: |
      The conversation so far, with the user's original request and any question-answer turns.
    question_description: |
      The assistant's clarification question to answer.
  output_schema:
    _target_: clarify.utils.user.user_answer_output_schema
    answer_description: |
      The user's answer to the question.
  api_call: ${llm}
