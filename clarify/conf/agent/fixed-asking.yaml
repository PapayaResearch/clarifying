# Hydra target class
_target_: clarify.utils.agents.Asker
# Agent name recorded in results
name: fixed-asking
# Fixed mode: the model asks exactly as many questions as the cap
mode: fixed
# Question cap per episode, as a multiple of the instance's redacted count
k_multiplier: 1
# The conversation model
model: ${model}
# Prompts shared by every agent
ask_prompt: ${task.ask_prompt}
final_prompt: ${task.final_prompt}
decide_prompt: ${task.decide_prompt}
