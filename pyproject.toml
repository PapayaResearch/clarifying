[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uaug"
version = "0.1.0"
description = "The User-Agent Utility Gap: measuring and reducing the communication gap via trained clarifying questions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hydra-core==1.3.2",
    "omegaconf==2.3.1",
    "litellm==1.91.3",
    "matplotlib==3.10.0",
    "pillow==12.3.0",
    "pyyaml==6.0.2",
    "pydantic==2.13.4",
    "python-dotenv==1.1.0",
    "rich==15.0.0",
    "tqdm==4.68.4",
    "requests==2.34.2",
    "tinker==0.25.0",
    "tinker-cookbook==0.5.4",
    "google-genai==2.20.0",
]

[tool.setuptools.packages.find]
include = ["uaug*", "scripts*"]

[tool.setuptools.package-data]
uaug = ["conf/**/*.yaml"]
