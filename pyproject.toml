[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uaug"
version = "0.1.0"
description = "The User-Agent Utility Gap: measuring and reducing the communication gap via trained clarifying questions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hydra-core==1.3.2",
    "litellm>=1.77.5",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "rich>=14.0",
    "tqdm>=4.67",
    "requests>=2.32",
    "truststore>=0.10",
]

[project.optional-dependencies]
train = ["tinker", "tinker-cookbook"]
train_local = ["torch>=2.4", "transformers>=4.48", "trl>=0.13", "peft>=0.14", "datasets>=3.0", "accelerate>=1.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["uaug*", "scripts*"]

[tool.setuptools.package-data]
uaug = ["conf/**/*.yaml"]
